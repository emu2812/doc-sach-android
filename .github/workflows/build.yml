name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # One fixed key for every build, held as an encrypted CI
          # secret (never in the repo), so new versions install OVER
          # the old one instead of being refused for a signature
          # mismatch. The hash is printed so it can be checked against
          # the known key before trusting the artifact.
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Missing KEYSTORE_B64 secret" >&2
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/release.keystore
          sha256sum signing/release.keystore

      - name: Build debug APK with SDK build-tools (no Gradle)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK"
          BT="$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          PLAT="$(ls "$SDK/platforms" | sort -V | tail -n 1)"
          echo "build-tools=$BT platform=$PLAT"
          BTBIN="$SDK/build-tools/$BT"
          AJAR="$SDK/platforms/$PLAT/android.jar"
          test -f "$AJAR"

          mkdir -p build/gen build/classes build/dex dist

          # 1) Compile resources and link the base APK (also generates R.java)
          "$BTBIN/aapt2" compile --dir res -o build/res.zip
          "$BTBIN/aapt2" link -o build/app-base.apk \
            -I "$AJAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            build/res.zip

          # 2) Compile the Java sources against the Android platform jar
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJAR" -cp "$AJAR" \
            -d build/classes $(find src build/gen -name '*.java')

          # 3) Dex
          (cd build/classes && jar cf ../classes.jar .)
          "$BTBIN/d8" --lib "$AJAR" --min-api 24 --output build/dex build/classes.jar

          # 4) Pack the dex into the APK and align
          cp build/app-base.apk build/app-unsigned.apk
          (cd build/dex && zip -q ../app-unsigned.apk classes.dex)
          "$BTBIN/zipalign" -f -p 4 build/app-unsigned.apk build/app-aligned.apk

          # 5) Sign with the repo's stable key (see the prepare step)
          "$BTBIN/apksigner" sign \
            --ks signing/release.keystore --ks-pass pass:docsach --key-pass pass:docsach \
            --out dist/doc-sach.apk build/app-aligned.apk
          "$BTBIN/apksigner" verify --verbose --print-certs dist/doc-sach.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-sach-apk
          path: dist/*.apk
          if-no-files-found: error
