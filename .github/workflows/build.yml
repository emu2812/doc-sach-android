name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare stable signing key
        run: |
          set -euo pipefail
          # One fixed key for every build, kept in the repo, so new
          # versions install OVER the old one instead of being refused
          # for a signature mismatch. First run generates and commits
          # it back (a GITHUB_TOKEN push does not retrigger this
          # workflow, so there is no loop).
          if [ ! -f signing/release.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.keystore \
              -storepass docsach -keypass docsach \
              -alias docsach -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Doc Sach,O=Personal,C=VN" -noprompt
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add signing/release.keystore
            git commit -m "Add stable signing keystore"
            git push
          fi
          ls -la signing

      - name: Build debug APK with SDK build-tools (no Gradle)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK"
          BT="$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          PLAT="$(ls "$SDK/platforms" | sort -V | tail -n 1)"
          echo "build-tools=$BT platform=$PLAT"
          BTBIN="$SDK/build-tools/$BT"
          AJAR="$SDK/platforms/$PLAT/android.jar"
          test -f "$AJAR"

          mkdir -p build/gen build/classes build/dex dist

          # 1) Compile resources and link the base APK (also generates R.java)
          "$BTBIN/aapt2" compile --dir res -o build/res.zip
          "$BTBIN/aapt2" link -o build/app-base.apk \
            -I "$AJAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            build/res.zip

          # 2) Compile the Java sources against the Android platform jar
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJAR" -cp "$AJAR" \
            -d build/classes $(find src build/gen -name '*.java')

          # 3) Dex
          (cd build/classes && jar cf ../classes.jar .)
          "$BTBIN/d8" --lib "$AJAR" --min-api 24 --output build/dex build/classes.jar

          # 4) Pack the dex into the APK and align
          cp build/app-base.apk build/app-unsigned.apk
          (cd build/dex && zip -q ../app-unsigned.apk classes.dex)
          "$BTBIN/zipalign" -f -p 4 build/app-unsigned.apk build/app-aligned.apk

          # 5) Sign with the repo's stable key (see the prepare step)
          "$BTBIN/apksigner" sign \
            --ks signing/release.keystore --ks-pass pass:docsach --key-pass pass:docsach \
            --out dist/doc-sach.apk build/app-aligned.apk
          "$BTBIN/apksigner" verify --verbose dist/doc-sach.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-sach-apk
          path: dist/*.apk
          if-no-files-found: error
